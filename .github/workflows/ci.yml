name: CI

on:
  push:
  pull_request:

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
          pip install pytest-cov
      - name: Run lint
        run: ruff check .
      - name: Run focused regression tests
        run: |
          python3 -m pytest -q \
            tests/test_commands.py \
            tests/test_mattermost_channel.py \
            tests/test_case_policy.py \
            tests/test_case_record_mode.py \
            tests/test_cases.py \
            tests/test_inspection_service.py \
            tests/test_inspection_multi_target.py \
            tests/test_case_multi_target_evidence.py \
            tests/test_audit_target_metadata.py \
            tests/test_exec_readonly_approval.py \
            tests/test_cron_inspection_tool.py \
            tests/test_hci_skills.py \
            tests/test_target_resolver.py
      - name: Run coverage
        run: |
          python3 -m pytest --cov=nanobot --cov-report=xml tests
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: warn
